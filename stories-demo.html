<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Stories demo | weej</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--text:#F5F5F5;--accent:#FF7A00;--surface:#161616;--surface2:#202020;--line:#4a4a4a;
  --head:'Poppins',system-ui,sans-serif;--body:'Barlow',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:17px;line-height:1.45}
body{padding:env(safe-area-inset-top,0px) 14px calc(env(safe-area-inset-bottom,0px) + 18px);min-height:100vh}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-top:14px}
.top{display:flex;align-items:center;gap:12px}
.top img{width:44px;height:auto}
.top h1{font-family:var(--head);font-weight:800;font-size:24px;line-height:1.15}
.top p{font-size:16px}
/* device */
.device{position:relative;border:2px solid var(--line);border-radius:22px;background:var(--surface);overflow:hidden;height:min(56vh,520px);min-height:380px}
.screen{position:absolute;inset:0;overflow:hidden;padding:18px 16px 60px}
.ring{position:absolute;width:46px;height:46px;border:4px solid var(--accent);border-radius:50%;pointer-events:none;opacity:0;transform:translate(-50%,-50%) scale(1.4);transition:opacity .2s, transform .25s;z-index:20;box-shadow:0 0 0 6px rgba(255,122,0,.25)}
.ring.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.toast{position:absolute;left:12px;right:12px;bottom:12px;background:var(--accent);color:#0a0a0a;font-weight:600;font-size:17px;padding:12px 14px;border-radius:12px;opacity:0;transform:translateY(12px);transition:.3s;z-index:25}
.toast.on{opacity:1;transform:none}
.overlay{position:absolute;inset:0;background:rgba(10,10,10,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;opacity:0;pointer-events:none;transition:.25s;z-index:22;font-size:18px}
.overlay.on{opacity:1}
.spin{width:48px;height:48px;border:5px solid var(--surface2);border-top-color:var(--accent);border-radius:50%;animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* narration */
.narr{min-height:118px}
.stepno{font-size:16px;font-weight:600;color:var(--accent);margin-bottom:4px}
.cap{font-family:var(--head);font-weight:700;font-size:21px;line-height:1.3}
.bar{display:flex;gap:6px}
.bar i{flex:1;height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;position:relative}
.bar i b{position:absolute;inset:0;width:0;background:var(--accent)}
.bar i.done b{width:100%}
.ctrls{display:flex;gap:10px}
.btn{font-family:var(--body);font-weight:600;font-size:17px;border-radius:12px;padding:12px 18px;border:2px solid var(--accent);background:transparent;color:var(--text);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn.fill{background:var(--accent);color:#0a0a0a}
.btn:focus-visible{outline:3px solid var(--text);outline-offset:2px}
.ctrls .btn{flex:1}
.end{position:absolute;inset:0;background:var(--bg);z-index:30;display:none;flex-direction:column;justify-content:center;gap:14px;padding:24px}
.end.on{display:flex}
.end h2{font-family:var(--head);font-weight:800;font-size:26px;line-height:1.2}
/* app pieces (shared) */
.a-head{text-align:center;border-bottom:3px solid var(--accent);padding-bottom:12px;margin-bottom:16px}
.a-head h2{font-family:var(--head);font-weight:800;font-size:26px}
.a-head p{font-size:16px}
.card{background:var(--surface2);border:2px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.card h3{font-family:var(--head);font-weight:700;font-size:18px;margin-bottom:4px}
.lbl{font-weight:600;font-size:16px;margin:12px 0 6px}
.field{background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:10px 12px;min-height:46px;font-size:17px;white-space:pre-wrap;word-break:break-word}
.field.focus{border-color:var(--accent)}
.field .ph{opacity:1}
.caret{display:inline-block;width:2px;height:1.1em;background:var(--accent);vertical-align:-3px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.abtn{display:block;width:100%;text-align:center;background:var(--accent);color:#0a0a0a;font-family:var(--head);font-weight:700;font-size:18px;border-radius:12px;padding:13px;margin:14px 0}
.abtn.ghost{background:transparent;color:var(--text);border:2px solid var(--accent)}
.pressed{transform:scale(.97);transition:transform .12s}
.hide{display:none}
.pop{animation:pop .35s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sec{font-family:var(--head);font-weight:700;font-size:19px;margin:18px 0 10px}.ex{font-style:italic;border-left:4px solid var(--accent);padding-left:10px;margin-top:6px}
.att{display:flex;align-items:center;gap:12px;padding:9px 4px;font-size:17px}.box{width:28px;height:28px;flex:none;border-radius:8px;border:2px solid var(--accent);display:inline-flex;align-items:center;justify-content:center;color:transparent;font-weight:700}
.box.on{background:var(--accent);color:#0a0a0a}.sub{margin:0 0 8px 40px}.sub .lbl{margin-top:0}
.li{display:flex;gap:12px;align-items:center}.li b{color:var(--accent);font-family:var(--head)}.li.sel{border-color:var(--accent)}
.usid{color:var(--accent);font-weight:600}.story{border-left:4px solid var(--accent);padding-left:10px;margin:8px 0}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px}.meta div{background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:8px 10px}.meta span{display:block;font-size:16px}.meta b{font-family:var(--head);font-size:22px;color:var(--accent)}
ul{padding-left:20px}li{margin:6px 0}.exp{display:grid;grid-template-columns:1fr 1fr;gap:8px}.exp .abtn{margin:0;font-size:16px;padding:10px}.exp.hl .abtn{background:var(--accent);color:#0a0a0a}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div class="lbl">Story Complexity</div><div class="field">Moderate (Standard features)</div>
<h3 class="sec" id="attrHead">Story Attributes</h3><div class="att" id="aStory"><span class="box on">&#10003;</span>User Story (required)</div><div class="att" id="aTitle"><span class="box">&#10003;</span>Title/Summary</div><div class="sub hide" id="tIn"><div class="lbl">Story title:</div><div class="field" id="titleF"></div></div><div class="att" id="aEpic"><span class="box">&#10003;</span>Epic/Theme</div><div class="att" id="aPri"><span class="box">&#10003;</span>Priority Level</div><div class="sub hide" id="pIn"><div class="lbl">Select priority:</div><div class="field" id="priF">Choose...</div></div><div class="att" id="aPts"><span class="box">&#10003;</span>Story Points</div><div class="sub hide" id="ptIn"><div class="lbl">Select story points:</div><div class="field" id="ptsF">Choose...</div></div><div class="att" id="aDesc"><span class="box">&#10003;</span>Description</div><div class="att" id="aAC"><span class="box">&#10003;</span>Acceptance Criteria</div><div class="att" id="aDod"><span class="box">&#10003;</span>Definition of Done</div>
<span class="abtn" id="gen">Generate Story</span>
<div id="lib" class="hide"><h3 class="sec">Library</h3><div class="card li" id="li"><b>US-001</b><span>View lab results online</span></div>
<div class="card hide" id="detail"><div class="usid">US-001</div><h3>View lab results online</h3>
<p class="story">As a user, I want to view lab results online so that I can see relevant information.</p>
<div class="meta"><div><span>Priority</span><b>High</b></div><div><span>Story points</span><b>3</b></div></div>
<div class="lbl">Acceptance criteria</div><ul><li>Given I am on the relevant page, when I perform the action, then the expected result occurs</li><li>Given I have the necessary permissions, when I access the feature, then I can use it successfully</li><li>Given invalid input is provided, when I submit, then appropriate error messages are displayed</li></ul></div></div>
<h3 class="sec" id="expHead">Export Library Options</h3>
<div class="exp" id="exp"><span class="abtn ghost">Jira CSV</span><span class="abtn ghost">Azure DevOps</span><span class="abtn ghost">Markdown</span><span class="abtn ghost">JSON Data</span></div></template>
<script>
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = s => document.querySelector(s);
const screen = $('#screen'), ring = $('#ring'), dev = $('#device');
let run = 0, paused = false;
class Stop extends Error{}
async function wait(ms){
  const id = run; let t = 0;
  while(t < ms){ await new Promise(r=>setTimeout(r,50)); if(id!==run) throw new Stop(); if(!paused) t+=50; }
}
function el(sel){ return screen.querySelector(sel); }
async function scrollTo(e){
  const top = e.offsetTop - 30;
  screen.scrollTo({top: Math.max(0, top - screen.clientHeight*0.25), behavior: RM?'auto':'smooth'});
  await wait(RM?100:650);
}
async function tap(sel){
  const e = el(sel); await scrollTo(e);
  const dr = dev.getBoundingClientRect(), r = e.getBoundingClientRect();
  ring.style.left = (r.left - dr.left + Math.min(r.width/2, r.width-30)) + 'px';
  ring.style.top = (r.top - dr.top + r.height/2) + 'px';
  ring.classList.add('on'); await wait(450);
  e.classList.add('pressed'); await wait(180); e.classList.remove('pressed');
  await wait(250); ring.classList.remove('on');
}
async function type(sel, text, speed=38){
  const e = el(sel); await scrollTo(e); e.classList.add('focus');
  e.textContent = ''; const caret = document.createElement('span'); caret.className='caret';
  const span = document.createElement('span'); e.append(span, caret);
  if(RM){ span.textContent = text; await wait(300); }
  else for(const ch of text){ span.textContent += ch; await wait(ch==='\n'?140:speed); }
  await wait(300); caret.remove(); e.classList.remove('focus');
}
async function toast(msg, ms=1800){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); await wait(ms); t.classList.remove('on'); }
async function overlay(msg, ms){ $('#overlayText').textContent=msg; $('#overlay').classList.add('on'); await wait(ms); $('#overlay').classList.remove('on'); }
async function reveal(sel){ const e=el(sel); e.classList.remove('hide'); e.classList.add('pop'); await scrollTo(e); }
const STEPS = [
{cap:"Pick the user story format your team uses.", go:async()=>{await tap('#tplClassic'); el('#tplClassic').classList.add('sel'); await toast('Selected Classic Agile template',1700)}, hold:900},
{cap:"Name the project.", go:async()=>{await type('#proj','Patient Portal')}, hold:900},
{cap:"Describe one requirement.", go:async()=>{await type('#req','Patients must be able to view lab results online',32)}, hold:1000},
{cap:"Check the details you want on the story.", go:async()=>{
  await tap('#aTitle'); el('#aTitle .box').classList.add('on'); await reveal('#tIn'); await type('#titleF','View lab results online');
  await tap('#aPri'); el('#aPri .box').classList.add('on'); await reveal('#pIn'); await tap('#priF'); el('#priF').textContent='High';
  await tap('#aPts'); el('#aPts .box').classList.add('on'); await reveal('#ptIn'); await tap('#ptsF'); el('#ptsF').textContent='3 - Small';
  await tap('#aAC'); el('#aAC .box').classList.add('on'); await wait(500)}, hold:900},
{cap:"Tap Generate Story.", go:async()=>{await tap('#gen'); await toast('Generating user story...',1300); await toast('User story created successfully!',1700); await reveal('#lib')}, hold:900},
{cap:"The story is saved to your library with acceptance criteria filled in.", go:async()=>{await tap('#li'); el('#li').classList.add('sel'); await reveal('#detail'); await wait(1500);
  screen.scrollTo({top:el('#detail').offsetTop+el('#detail').offsetHeight-screen.clientHeight+20,behavior:RM?'auto':'smooth'}); await wait(2200)}, hold:1200},
{cap:"Export your library to Jira, Azure DevOps, Markdown, or JSON.", go:async()=>{await scrollTo(el('#expHead')); el('#exp').classList.add('hl'); await wait(600)}, hold:2600}
];
const bar = $('#bar'); bar.innerHTML = STEPS.map(()=>'<i><b></b></i>').join('');
function setStep(i){
  [...bar.children].forEach((b,j)=>b.classList.toggle('done', j<=i));
  $('#stepno').textContent = 'Step ' + (i+1) + ' of ' + STEPS.length;
  $('#cap').textContent = STEPS[i].cap;
}
async function play(){
  const id = ++run; paused=false; $('#pp').textContent='Pause';
  $('#end').classList.remove('on'); $('#overlay').classList.remove('on'); $('#toast').classList.remove('on'); ring.classList.remove('on');
  screen.innerHTML = $('#initial').innerHTML; screen.scrollTop = 0;
  try{
    for(let i=0;i<STEPS.length;i++){ setStep(i); await wait(900); await STEPS[i].go(); await wait(STEPS[i].hold||1400); }
    $('#stepno').textContent = 'Demo complete'; $('#cap').textContent = 'Restarting shortly. Tap Pause to stay here.';
    $('#end').classList.add('on'); await wait(12000); if(id===run) play();
  }catch(e){ if(!(e instanceof Stop)) throw e; }
}
$('#pp').onclick = ()=>{ paused=!paused; $('#pp').textContent = paused?'Play':'Pause'; };
$('#rs').onclick = play; $('#again').onclick = play;
play();
</script>
</body>
</html>
